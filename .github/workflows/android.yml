name: Android APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.9/bin/gradle
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true

      - name: Check release keystore
        working-directory: android
        run: |
          if [ ! -f keystore/chenguang.p12 ]; then
            echo "缺少固定正式签名证书 android/keystore/chenguang.p12"
            exit 1
          fi
          ls -lh keystore/chenguang.p12

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dshx-game-su-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "模拟市长：城市经营 · build ${{ github.run_number }}"
          body: "正式签名 APK（com.dshx.game.she · 1.0.2），可直接安装。旧包名需先卸载。"
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
